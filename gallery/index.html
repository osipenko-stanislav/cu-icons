<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Icon library review</title>
<style>
:root{color-scheme:light dark;--paper:#f7f7f2;--text:#263932;--line:#d6ddd3;--tile:#fff;--cols:112px}
:root.dark{--paper:#1f2624;--text:#f2f5ec;--line:#54615b;--tile:#303935}
*{box-sizing:border-box}
body{font:15px/1.4 system-ui,sans-serif;background:var(--paper);color:var(--text);margin:0 auto;padding:24px;max-width:1440px}
h1,h2,h3,p{margin:0 0 12px} h1{font-size:26px}
.toolbar{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin:10px 0}
label{display:inline-flex;gap:5px;align-items:center}
input,select,button,textarea{font:inherit;color:inherit;background:var(--tile);border:1px solid var(--line);padding:5px 7px;border-radius:5px}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
input[type=color]{padding:1px;width:35px;height:28px}
#grid,#refs,#related{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cols),1fr));gap:8px}
#grid{margin:16px 0}.tile{position:relative;min-width:0;background:var(--tile);border-radius:6px;border:1px solid var(--line)}
.tile button{width:100%;border:0;background:none;padding:11px 4px}.tile img{display:block;margin:3px auto 6px}
.tile span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;opacity:.75}.tile input{position:absolute;left:3px;top:3px}
.optical .tile{border:0;background:none}.optical .tile input,.optical .tile small,.optical .bulk,.optical #detail{display:none}
.hide-names .tile span{display:none}
#detail{margin:24px 0;padding:16px;border:1px solid var(--line);border-radius:6px}
#detail pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tile);padding:10px}
#comparison{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}figure{margin:0;text-align:center}
textarea{display:block;width:min(560px,100%);margin:12px 0}
details{margin:12px 0}
</style>
<h1>Icon library review</h1>
<div class="toolbar">
 <label>Search <input id="query" type="search"></label>
 <label>Category <select id="category"></select></label>
 <label>Family <select id="family"></select></label>
 <label>Geometry <select id="geometry"></select></label>
 <label>Status <select id="status"></select></label>
</div>
<div class="toolbar">

 <label>Ink <input type="color" id="ink" value="#263932"></label>
 <label>Background <input type="color" id="bg" value="#f7f7f2"></label>
 <label>Optical review <input type="checkbox" id="optical"></label>
 <label>Hide names <input type="checkbox" id="hide"></label>
</div>
<details open><summary>Reference icons</summary><div id="refs"></div></details>
<div class="toolbar bulk">
 <button id="selectPage">Select page</button><button id="clearSelection">Clear selection</button>
 <button id="approve">Approve selected</button><button id="reject">Reject selected</button><button id="manual">Manual review selected</button>
 <label><input type="checkbox" id="pilot"> Confirm pilot</label>
 <button id="download">Download review decisions</button><button id="svgpack">Download approved SVG sprite</button>
</div>
<p id="message" role="status">Download review decisions, then run <code>review-import</code> to save them to the project manifest.</p>

<div class="toolbar"><button id="prev">Previous</button><span id="pageLabel"></span><button id="next">Next</button></div>
<section id="detail" hidden>

</section>

<script>
'use strict';
const $ = id => document.getElementById(id);
const payload = JSON.parse($('data').textContent);
const icons = payload.icons;
const selected = new Set(), pending = new Map();
const decoder = new TextDecoder(), encoder = new TextEncoder();
const pageSize = 80;
let page = 0, current, visible = [], refsPage = 0;
const filters = ['category','family','geometry','status'];
const dec = uri => decoder.decode(Uint8Array.from(atob(uri.split(',')[1]), ch => ch.charCodeAt(0)));
function enc(svg) {
  const bytes = encoder.encode(svg);
  let binary = '';
  for (let i=0;i<bytes.length;i+=8192) binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return 'data:image/svg+xml;base64,'+btoa(binary);
}
function colored(uri) {
  if (!uri?.startsWith('data:image/svg+xml')) return uri;
  return enc(dec(uri).replace(/=["']currentColor["']/gi,'="'+$('ink').value+'"'));
}
function image(uri,size) {
  const node = document.createElement('img');
  node.alt=''; node.width=size; node.height=size; node.loading='lazy';
  if(uri) node.src=colored(uri);
  return node;
}
function state(icon) {
  return pending.get(icon.id)?.decision === 'Comment' ? icon.status :
    (pending.get(icon.id)?.decision || icon.status);
}
function tile(icon,isRef=false) {
  const box=document.createElement('div'); box.className='tile';
  const button=document.createElement('button'); button.title=icon.id;
  button.setAttribute('aria-label',icon.id);
  button.append(image(icon.uri,Number($('size').value)));
  const name=document.createElement('span'); name.textContent=icon.id; button.append(name);
  if(!isRef) {
    const status=document.createElement('small'); status.textContent=state(icon); button.append(status);
    const checkbox=document.createElement('input'); checkbox.type='checkbox';
    checkbox.setAttribute('aria-label','Select '+icon.id); checkbox.checked=selected.has(icon.id);
    checkbox.onchange=()=>checkbox.checked?selected.add(icon.id):selected.delete(icon.id);
    box.append(checkbox); button.onclick=()=>{current=icon; details(); $('detail').scrollIntoView({block:'nearest'});};
  } else button.onclick=()=>{current={...icon,name:icon.id,meaning:'Reference'};details();};
  box.append(button); return box;
}
function list() {
  const query=$('query').value.trim().toLowerCase();
  const found=icons.filter(icon=>filters.every(key=>!$(key).value || $(key).value===(key==='status'?state(icon):icon[key])) &&
    (!query || [icon.id,icon.name,icon.meaning,icon.metaphor].join(' ').toLowerCase().includes(query)));
  const pages=Math.max(1,Math.ceil(found.length/pageSize));
  page=Math.min(page,pages-1); visible=found.slice(page*pageSize,(page+1)*pageSize);
  $('grid').replaceChildren(...visible.map(icon=>tile(icon)));
  $('pageLabel').textContent=found.length+' icons · '+(page+1)+' / '+pages;
  $('prev').disabled=page===0; $('next').disabled=page+1===pages;
  const references=Object.entries(payload.references).filter(([,uri])=>uri);
  const refNodes=references.slice(refsPage*24,refsPage*24+24).map(([id,uri])=>tile({id,uri},true));
  if(references.length>24) {
    for (const [label,delta] of [['Previous references',-1],['Next references',1]]) {
      const b=document.createElement('button'); b.textContent=label;
      b.disabled=refsPage+delta<0||(refsPage+delta)*24>=references.length;
      b.onclick=()=>{refsPage+=delta;list();}; refNodes.push(b);
    }
  }
  $('refs').replaceChildren(...refNodes);
}
function details() {
  if(!current) return;
  const icon=current; $('detail').hidden=false;
  $('detailTitle').textContent=icon.name || icon.id; $('meaning').textContent=icon.meaning || '';
  $('comparison').replaceChildren();
  for(const [caption,uri] of [['Original',icon.original],['Current',icon.uri]]) {
    if(!uri) continue;
    const fig=document.createElement('figure'), label=document.createElement('figcaption');
    label.textContent=caption;
    fig.append(image(uri,Number($('size').value)),label); $('comparison').append(fig);
  }
  $('related').replaceChildren(...(icon.family?icons.filter(x=>x.family===icon.family && x.id!==icon.id).slice(0,24).map(x=>tile(x)):[]));
  $('onlyFamily').disabled=!icon.family;
  $('code').textContent=icon.uri?.startsWith('data:image/svg+xml')?dec(icon.uri):'SVG source unavailable';
  $('copy').disabled=!icon.uri?.startsWith('data:image/svg+xml');
  $('facts').textContent=JSON.stringify({status:icon.status,validation:icon.validation,review:icon.review,history:icon.history},null,2);
  $('saveComment').disabled=!icon.sha256;
  $('comment').value=pending.get(icon.id)?.comment || '';
}
function download(data,name,type) {
  const blob=new Blob([data],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function queue(decision) {
  const eligible=icons.filter(i=>selected.has(i.id) && i.sha256 &&
        (decision!=='Approved' || (i.uri && i.status!=='Rejected')));
  for(const i of eligible) pending.set(i.id,{id:i.id,sha256:i.sha256,decision,
                                           comment:pending.get(i.id)?.comment || ''});
  $('message').textContent=eligible.length+' decisions queued. Download and import them to persist.';
  list();
}
for(const key of filters) {
  $(key).add(new Option('All',''));
  const values=new Set(icons.map(i=>i[key]).filter(Boolean));
  if(key==='status') for(const v of ['Approved','Rejected','Needs manual review']) values.add(v);
  for(const value of [...values].sort()) $(key).add(new Option(value,value));
}
for(const key of [...filters,'query']) $(key).oninput=()=>{page=0;list();};
$('prev').onclick=()=>{page--;list();};
$('next').onclick=()=>{page++;list();};
$('size').onchange=$('ink').oninput=()=>{list();details();};
$('bg').oninput=()=>{document.documentElement.style.setProperty('--paper',$('bg').value);};
$('density').onchange=()=>{document.documentElement.style.setProperty('--cols',$('density').value+'px');};
$('dark').onchange=()=>{
  const dark=$('dark').checked; document.documentElement.classList.toggle('dark',dark);
  $('bg').value=dark?'#1f2624':'#f7f7f2'; $('bg').oninput();
  $('ink').value=dark?'#f2f5ec':'#263932'; list();details();
};
$('optical').onchange=()=>document.body.classList.toggle('optical',$('optical').checked);
$('hide').onchange=()=>document.body.classList.toggle('hide-names',$('hide').checked);
$('onlyFamily').onclick=()=>{$('family').value=current.family;page=0;list();};
$('copy').onclick=async()=>{
  try { await navigator.clipboard.writeText($('code').textContent); $('message').textContent='SVG copied.'; }
  catch { const r=document.createRange(); $('code').parentElement.open=true; r.selectNodeContents($('code')); getSelection().removeAllRanges(); getSelection().addRange(r); }
};
$('saveComment').onclick=()=>{
  if(!$('comment').value.trim() || !current?.sha256) return;
  pending.set(current.id,{id:current.id,sha256:current.sha256,
    decision:pending.get(current.id)?.decision || 'Comment',comment:$('comment').value.trim()});
  $('message').textContent='Comment queued. Download and import to persist.';
};
$('selectPage').onclick=()=>{for(const i of visible) selected.add(i.id);list();};
$('clearSelection').onclick=()=>{selected.clear();list();};
$('approve').onclick=()=>queue('Approved');
$('reject').onclick=()=>queue('Rejected');
$('manual').onclick=()=>queue('Needs manual review');
$('pilot').disabled=!payload.pilot.length;
$('download').onclick=()=>download(JSON.stringify({schema_version:1,approve_pilot:$('pilot').checked,
                                                    decisions:[...pending.values()]},null,2),'icon-review.json','application/json');
$('svgpack').onclick=()=>{
 const ns='http://www.w3.org/2000/svg', doc=document.implementation.createDocument(ns,'svg');
 for(const icon of icons.filter(i=>i.status==='Approved' && i.uri)) {
   const src=new DOMParser().parseFromString(dec(icon.uri),'image/svg+xml').documentElement;
   const ids=new Map();
   for(const node of [src,...src.querySelectorAll('[id]')]) if(node.id) ids.set(node.id,icon.id+'--'+node.id);
   for(const node of [src,...src.querySelectorAll('*')]) {
     if(node.id) node.id=ids.get(node.id);
     for(const a of [...node.attributes]) {
       if(a.localName==='href' && a.value.startsWith('#')) a.value='#'+ids.get(a.value.slice(1));
       else if(a.value.includes('url(')) a.value=a.value.replace(/url\(\s*#([^\s)]+)\s*\)/g,(_,id)=>'url(#'+ids.get(id)+')');
     }
   }
   // Use a wrapper to preserve references to the original root ID, if present.
   const symbol=doc.createElementNS(ns,'symbol'); symbol.id=icon.id;
   for(const a of [...src.attributes]) if(!['width','height','version','id','xmlns'].includes(a.name)) symbol.setAttributeNS(a.namespaceURI,a.name,a.value);
   const body=src.id?doc.createElementNS(ns,'g'):symbol;
   if(src.id) {body.id=src.id;symbol.append(body);}
   for(const child of [...src.childNodes]) body.append(doc.importNode(child,true));
   doc.documentElement.append(symbol);
 }
 if(!doc.documentElement.children.length) {$('message').textContent='No persisted approvals yet.';return;}
 download(new XMLSerializer().serializeToString(doc),'approved-sprite.svg','image/svg+xml');
};
list();
</script>
</html>
