<!doctype html><html lang="ru"><meta charset="utf-8"><title>Анимации CU Iconizer</title><style>body{background:#171a21;color:white;font:16px system-ui;display:flex;flex-wrap:wrap;gap:14px;padding:24px}button{background:none;border:1px solid #ffffff44;border-radius:8px;color:white;padding:16px;cursor:pointer}svg{display:block;margin:auto auto 8px;width:56px;height:56px}svg{overflow:visible}svg :is(path,circle,ellipse,rect,line,polyline,polygon){vector-effect:non-scaling-stroke;stroke-width:var(--icon-stroke,1px)}</style><script>@@PLAYER@@
const scenes=@@SCENES@@; const preset=@@PRESET@@; document.addEventListener('DOMContentLoaded',()=>{for(const scene of scenes){const button=document.createElement('button');button.innerHTML=scene.svg;button.append(scene.label);document.body.append(button);const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){if(!button.motion)button.motion=mountMotion(button,[...button.querySelectorAll('[data-part]')],scene,()=>preset);else button.motion.resume?.()}else button.motion?.suspend?.()}},{rootMargin:'120px'});observer.observe(button);}});</script>
